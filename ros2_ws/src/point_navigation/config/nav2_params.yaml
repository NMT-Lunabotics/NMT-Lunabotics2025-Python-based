amcl:
  ros__parameters:
    use_sim_time: false
    enabled: false

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      allow_unknown: true
      tolerance: 1.0
      downsample_costmap: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      smooth_path: true
      smoother_max_iterations: 1000
      smoother_data_weight: 0.5
      smoother_smooth_weight: 0.3
      smoother_degree: 2

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    controller_plugins: ["FollowPath"]

    min_theta_velocity_threshold: 0.3

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      desired_linear_vel: 0.5
      min_x_velocity_threshold: 0.1
      min_approach_linear_velocity: 0.0
      regulated_linear_scaling_min_speed: 0.0

      max_angular_vel: 0.6
      max_angular_accel: 0.5
      rotate_to_heading_angular_vel: 0.4
      rotate_to_heading_min_angle: 0.3
      use_rotate_to_heading: false

      lookahead_dist: 0.4
      min_lookahead_dist: 0.2
      max_lookahead_dist: 0.6
      use_velocity_scaled_lookahead_dist: true

      use_interpolation: false
      transform_tolerance: 0.5

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: "/rtabmap/odom"
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - smoother_server
      - bt_navigator
      - global_costmap
      - local_costmap

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link

      update_frequency: 2.0
      publish_frequency: 1.0

      resolution: 0.05
      rolling_window: false
      track_unknown_space: true

      footprint: "[[0.65, 0.3715], [0.65, -0.3715], [-0.65, -0.3715], [-0.65, 0.3715]]"
      transform_tolerance: 0.5
      always_send_full_costmap: true

      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        subscribe_to_updates: true
        map_subscribe_transient_local: true
        lethal_cost_threshold: 95
        unknown_cost_value: 0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.2

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link

      update_frequency: 5.0
      publish_frequency: 2.0

      resolution: 0.05
      rolling_window: true
      width: 3
      height: 3

      footprint: "[[0.65, 0.3715], [0.65, -0.3715], [-0.65, -0.3715], [-0.65, 0.3715]]"
      transform_tolerance: 0.5
      always_send_full_costmap: true

      plugins: ["voxel_layer", "obstacle_layer", "inflation_layer"]

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        observation_sources: depth
        publish_voxel_map: true

        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0

        depth:
          topic: /camera/camera/depth/color/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          obstacle_range: 5.0
          raytrace_range: 3.0
          min_obstacle_height: 0.0
          max_obstacle_height: 2.0
          observation_persistence: 0.0

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: depth_cloud

        depth_cloud:
          topic: /camera/camera/depth/color/points
          data_type: PointCloud2
          marking: true
          clearing: true
          obstacle_range: 1.5
          raytrace_range: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.2