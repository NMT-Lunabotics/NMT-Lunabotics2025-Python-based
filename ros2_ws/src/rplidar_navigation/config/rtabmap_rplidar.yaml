slam_toolbox:
  ros__parameters:
    # Frame configuration
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    
    # Topic configuration
    scan_topic: /scan
    map_topic: /map
    pose_topic: /pose
    
    # RPLIDAR A3 specific settings
    max_laser_range: 40.0
    minimum_time_interval: 0.5
    transform_timeout: 0.5
    tf_buffer_duration: 10.0
    
    # Map resolution
    resolution: 0.05
    
    # Optimization parameters
    throttle_scans: 1
    use_scan_matching: true
    use_scan_barycenter: true
    
    # Loop closure
    use_loop_closure: true
    loop_closure_search_distance: 5.0
    loop_closure_minimum_chain_size: 10
    
    # For RPLIDAR (270° FOV)
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    
    # Mode - async for online mapping
    mode: mapping