slam_toolbox:
  ros__parameters:
    use_sim_time: false
    debug_logging: true

    # Frames
    map_frame: map
    odom_frame: odom           # now a real frame in TF
    base_frame: body      # robot base, not the lidar

    # Topics
    scan_topic: /scan
    #publish a tf map -> odom
    publish_tf: true
    
    #timimng
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    transform_publish_period: 0.02
   
    #operation made
    mode: mapping #changes to "localization" when have a saved map
   
    #performance
    throttle_scans: 1
    map_update_interval: 0.2
    resolution: 0.05
    max_laser_range: 8.0 
    minimum_time_interval: 0.0 
    # Motion thresholds
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.1
