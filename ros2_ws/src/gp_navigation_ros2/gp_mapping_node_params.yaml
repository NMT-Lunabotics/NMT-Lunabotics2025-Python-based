gp_mapping_module:
  ros__parameters:
    cloud_topic: /cloud_registered_body
    odom_frame: odom
    base_frame: body
    publish_frame: odom

    resolution: 0.05
    length_in_x: 3.5
    length_in_y: 3.5
    min_range_m: 0.20
    max_range_m: 5.5
    max_points: 7000

    z_min_world: -1.5
    z_max_world: 1.5

    self_radius_m: 0.25
    fov_deg: 180.0
    pole_center_deg: 180.0
    pole_width_deg: 20.0

    inducing_points: 300
    gp_noise: 0.01
    kernel_lengthscale: 0.20
    kernel_outputscale: 0.10

    origin_hold_m: 0.05

    slope_crit: 0.40
    flatness_crit: 0.04
    step_crit: 0.08
    sigma_percentile: 97.0

    w_slope: 0.45
    w_flatness: 0.20
    w_step: 0.35

    flatness_window_m: 0.30
    step_window_m: 0.20

